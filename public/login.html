<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Devify - Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="#" class="logo">🎵 Devify</a>
    </header>
    <div class="container" style="max-width: 420px;">
        <h2>Para continuar, faça login no Devify.</h2>
        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail ou nome de utilizador</label>
                <input type="email" id="email" placeholder="E-mail ou nome de utilizador" required>
            </div>
            <div class="form-group">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" placeholder="Palavra-passe" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 10px;">Entrar</button>
        </form>
        <div class="link-box">
            <p>Não tem uma conta? <a href="cadastro.html">Inscreva-se no Devify</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
