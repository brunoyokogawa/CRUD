<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Devify - Inscrever-se</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🎵 Devify</a>
    </header>
    <div class="container">
        <h2>Inscreva-se com o seu e-mail</h2>
        <form id="form-cadastro" class="form-grid">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>Sobrenome</label>
                <input type="text" id="sobrenome" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" minlength="14" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="telefone" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Palavra-passe</label>
                <input type="password" id="senha" required>
            </div>
            <div class="form-group">
                <label>Rua</label>
                <input type="text" id="rua" required>
            </div>
            <div class="form-group">
                <label>CEP</label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9" minlength="9" required>
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="cidade" required>
            </div>
            <div class="form-group">
                <label>Estado</label>
                <input type="text" id="estado" maxlength="2" required>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn" style="margin-top: 15px;">Inscrever-se</button>
            </div>
        </form>
        <div class="link-box">
            <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
        </div>
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
